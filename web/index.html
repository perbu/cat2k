<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- Fonts: Hanken Grotesk (UI) + JetBrains Mono (numerals) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #16181D;
            --text-2: #5B626C;
            --text-3: #9198A2;
            --text-4: #B4BAC2;
            --panel: #FFFFFF;
            --card: #F8F9FA;
            --card-border: #ECEEF1;
            --hairline: #EEF0F2;
            --seg-track: #F0F2F4;
            --slider-track: #DFE3E7;
            --canvas: #E7EBEA;
            --bella: #17BE7E;
            --luna: #F5991F;
            --batt: #7A828C;
            --batt-shell: #A8AEB6;
            --batt-low: #E08A00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--canvas);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            font-variant-numeric: tabular-nums;
        }

        #container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #sidebar {
            width: 344px;
            flex-shrink: 0;
            background: var(--panel);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 1px 0 0 var(--hairline);
            z-index: 800;
        }

        #map {
            flex: 1;
            position: relative;
        }

        /* ---------- Header ---------- */
        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: var(--ink);
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .live {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--bella);
        }

        .live-dot {
            position: relative;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--bella);
        }

        .live-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--bella);
            animation: livePulse 2.4s ease-out infinite;
        }

        @keyframes livePulse {
            0%   { transform: scale(1);   opacity: 0.6; }
            80%  { transform: scale(2.4); opacity: 0; }
            100% { opacity: 0; }
        }

        /* ---------- Update ---------- */
        .btn-update {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 11px;
            background: var(--ink);
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.15s;
        }

        .btn-update:hover:not(:disabled) { opacity: 0.88; }
        .btn-update:disabled { opacity: 0.55; cursor: default; }

        .btn-update .sync-icon {
            display: inline-block;
            font-size: 15px;
            line-height: 1;
        }

        .btn-update.syncing .sync-icon { animation: spin 1s linear infinite; }

        .update-caption {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 8px;
            font-size: 11.5px;
            color: var(--text-3);
        }

        .update-caption .mono { font-size: 11.5px; color: var(--text-2); }

        /* ---------- Section label ---------- */
        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-3);
            margin-bottom: 8px;
        }

        /* ---------- Segmented control ---------- */
        .segmented {
            display: flex;
            gap: 3px;
            background: var(--seg-track);
            padding: 3px;
            border-radius: 11px;
        }

        .seg {
            flex: 1;
            border: none;
            background: transparent;
            border-radius: 8px;
            padding: 7px 0;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-2);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .seg:hover:not(.active) { color: var(--ink); }

        .seg.active {
            background: #fff;
            color: var(--ink);
            box-shadow: 0 1px 2px rgba(22,24,29,0.10), 0 0 0 0.5px rgba(22,24,29,0.04);
        }

        .date-inputs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .date-inputs input[type="date"] {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: var(--ink);
            background: #fff;
        }

        .date-inputs input[type="date"]:focus {
            outline: none;
            border-color: var(--ink);
        }

        /* ---------- Cat cards ---------- */
        #cat-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cat-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 13px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cat-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .cat-name {
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        /* Battery pill */
        .battery {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .batt-shell {
            position: relative;
            width: 18px;
            height: 10px;
            border: 1.4px solid var(--batt-shell);
            border-radius: 2.5px;
            padding: 1px;
        }

        .batt-shell::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 1.6px;
            height: 4px;
            border-radius: 0 1px 1px 0;
            background: var(--batt-shell);
        }

        .batt-fill {
            display: block;
            height: 100%;
            background: var(--batt);
            border-radius: 1px;
        }

        .batt-pct {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-2);
        }

        .battery.low .batt-fill { background: var(--batt-low); }
        .battery.low .batt-pct  { color: var(--batt-low); }

        .cat-meta {
            font-size: 12px;
            color: var(--text-3);
            margin-top: -2px;
        }

        /* Bar chart */
        .cat-bars {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 52px;
        }

        .activity-bar {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            cursor: default;
        }

        .activity-bar-fill {
            width: 100%;
            border-radius: 3px;
            min-height: 3px;
            transition: height 0.2s;
        }

        .cat-daylabels {
            display: flex;
            gap: 5px;
        }

        .cat-daylabels span {
            flex: 1;
            text-align: center;
            font-size: 11px;
            color: var(--text-4);
        }

        .cat-daylabels span.today {
            font-weight: 700;
        }

        .cat-divider {
            height: 1px;
            background: var(--hairline);
        }

        .cat-totals {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 12px;
            color: var(--text-3);
        }

        .cat-totals b {
            font-weight: 600;
            font-size: 13px;
            color: var(--ink);
        }

        /* ---------- Heat map card ---------- */
        .heatmap-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 13px 14px;
        }

        .heatmap-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-title { font-size: 13px; font-weight: 600; }
        .card-sub   { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }

        .toggle {
            margin-left: auto;
            flex-shrink: 0;
            width: 40px;
            height: 24px;
            border: none;
            border-radius: 20px;
            background: var(--slider-track);
            cursor: pointer;
            padding: 0;
            position: relative;
            transition: background 0.18s;
        }

        .toggle.on { background: var(--ink); }

        .toggle .knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.25);
            transition: transform 0.18s;
        }

        .toggle.on .knob { transform: translateX(16px); }

        .slider-stack {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.18s;
        }

        .slider-stack.auto {
            opacity: 0.42;
            pointer-events: none;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-row .slabel {
            width: 56px;
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-3);
        }

        .slider-row .svalue {
            width: 34px;
            flex-shrink: 0;
            text-align: right;
            font-size: 12px;
            color: var(--text-2);
        }

        input[type="range"] {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: var(--slider-track);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            border: 1.5px solid var(--ink);
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            border: 1.5px solid var(--ink);
            cursor: pointer;
        }

        /* ---------- Footer ---------- */
        .panel-footer {
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid var(--hairline);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11.5px;
            color: var(--text-3);
        }

        /* ---------- Activity tooltip ---------- */
        #activity-tooltip {
            position: fixed;
            z-index: 1100;
            pointer-events: none;
            background: var(--ink);
            color: #fff;
            padding: 0.5rem 0.65rem;
            border-radius: 8px;
            font-size: 11.5px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.12s;
            min-width: 140px;
        }

        #activity-tooltip.show { opacity: 1; }

        #activity-tooltip .tip-head {
            font-weight: 600;
            margin-bottom: 0.35rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        #activity-tooltip .tip-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            line-height: 1.6;
        }

        #activity-tooltip .tip-row span { color: var(--text-4); }
        #activity-tooltip .tip-row b { font-family: 'JetBrains Mono', monospace; font-weight: 500; }

        /* Additive blending so overlapping heatmaps mix toward white */
        .leaflet-heatmap-layer { mix-blend-mode: screen; }

        .cat-pin-icon { background: transparent; border: none; }

        /* ---------- Map overlays ---------- */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            z-index: 1000;
            text-align: center;
            color: var(--text-2);
            font-size: 13px;
        }

        #loading.hidden { display: none; }

        .spinner {
            border: 3px solid var(--hairline);
            border-top: 3px solid var(--ink);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #error {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #E5484D;
            color: #fff;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            max-width: 380px;
            font-size: 13px;
            z-index: 1000;
            display: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        #error.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            #container { flex-direction: column; }
            #sidebar { width: 100%; max-height: 45vh; }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <!-- Header -->
            <div class="panel-header">
                <span class="brand-mark">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
                        <ellipse cx="6" cy="9.5" rx="2.1" ry="2.9"/>
                        <ellipse cx="12" cy="7" rx="2.3" ry="3.1"/>
                        <ellipse cx="18" cy="9.5" rx="2.1" ry="2.9"/>
                        <path d="M12 12c-2.8 0-5 2-5 4.4C7 18.4 8.7 19.5 12 19.5s5-1.1 5-3.1C17 14 14.8 12 12 12z"/>
                    </svg>
                </span>
                <span class="brand-name">Cat Tracker</span>
                <span class="live"><span class="live-dot"></span>Live</span>
            </div>

            <!-- Update -->
            <div>
                <button id="sync-btn" class="btn-update" title="Fetch the latest positions from Weenect now">
                    <span class="sync-icon">↻</span>
                    <span class="sync-label">Update</span>
                </button>
                <div class="update-caption">
                    <span id="update-time">Updated —</span>
                    <span id="update-count" class="mono">—</span>
                </div>
            </div>

            <!-- Date range -->
            <div>
                <div class="section-label">Date range</div>
                <div class="segmented" id="date-presets">
                    <button class="seg active" data-days="7">7d</button>
                    <button class="seg" data-days="30">30d</button>
                    <button class="seg" data-days="90">90d</button>
                    <button class="seg" data-days="custom">Custom</button>
                </div>
                <div class="date-inputs" id="custom-dates" style="display: none;">
                    <input type="date" id="start-date" />
                    <input type="date" id="end-date" />
                </div>
            </div>

            <!-- Cat cards -->
            <div id="cat-cards"></div>

            <!-- Heat map -->
            <div class="heatmap-card">
                <div class="heatmap-head">
                    <div>
                        <div class="card-title">Auto-tune</div>
                        <div class="card-sub">Heat map adapts to zoom &amp; density</div>
                    </div>
                    <button class="toggle on" id="autotune-toggle" role="switch" aria-checked="true" aria-label="Auto-tune heat map">
                        <span class="knob"></span>
                    </button>
                </div>
                <div class="slider-stack auto" id="slider-stack">
                    <div class="slider-row">
                        <span class="slabel">Intensity</span>
                        <input type="range" id="intensity-slider" min="0.05" max="1.0" step="0.05" value="0.3">
                        <span class="svalue mono" id="intensity-value">0.30</span>
                    </div>
                    <div class="slider-row">
                        <span class="slabel">Radius</span>
                        <input type="range" id="radius-slider" min="10" max="50" step="5" value="25">
                        <span class="svalue mono" id="radius-value">25</span>
                    </div>
                    <div class="slider-row">
                        <span class="slabel">Blur</span>
                        <input type="range" id="blur-slider" min="5" max="30" step="5" value="15">
                        <span class="svalue mono" id="blur-value">15</span>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="panel-footer">
                <span class="mono" id="footer-count">—</span>
                <span id="footer-since">—</span>
            </div>
        </div>

        <div id="map">
            <div id="loading">
                <div class="spinner"></div>
                <div>Loading tracker data…</div>
            </div>

            <div id="error"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Leaflet.heat plugin -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <!-- Application code -->
    <script src="app.js"></script>
</body>
</html>
